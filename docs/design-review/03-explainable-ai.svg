<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1920" y2="1080"><stop stop-color="#070D16"/><stop offset=".62" stop-color="#101426"/><stop offset="1" stop-color="#073A45"/></linearGradient>
    <radialGradient id="pink"><stop stop-color="#71324F" stop-opacity=".62"/><stop offset="1" stop-color="#71324F" stop-opacity="0"/></radialGradient>
    <clipPath id="main-card"><rect x="76" y="272" width="810" height="476" rx="22"/></clipPath>
    <clipPath id="phase-card"><rect x="76" y="770" width="810" height="228" rx="18"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg3)"/><ellipse cx="220" cy="1070" rx="620" ry="390" fill="url(#pink)"/>
  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="76" y="74" fill="#C8FF43" font-size="18" font-weight="600" letter-spacing="4">EXPLAINABLE AI</text>
    <text x="76" y="146" fill="white" font-size="54" font-weight="700">让评分有依据，让建议可执行</text>
    <text x="76" y="198" fill="#A8B3C2" font-size="25">每一条反馈，都能回到可观察的动作指标</text>

    <rect x="64" y="260" width="834" height="500" rx="28" fill="#07110C" stroke="#30473A"/>
    <g clip-path="url(#main-card)"><image href="source-explainable-ai.png" x="1" y="78" width="1843" height="1037"/></g>
    <rect x="96" y="292" width="134" height="38" rx="19" fill="#C8FF43"/><text x="163" y="317" text-anchor="middle" fill="#07110C" font-size="15" font-weight="700">关键动作证据</text>

    <rect x="64" y="758" width="834" height="252" rx="24" fill="#07110C" stroke="#30473A"/>
    <g clip-path="url(#phase-card)"><image href="source-explainable-ai.png" x="1" y="110" width="1843" height="1037"/></g>
    <g transform="translate(116 970)" fill="#C8FF43" font-size="15" font-weight="600">
      <text>准备</text><text x="202">引拍</text><text x="404">击球</text><text x="606">随挥</text>
    </g>

    <g transform="translate(980 252)">
      <text fill="#8290A2" font-size="16" font-weight="600" letter-spacing="2">EVIDENCE → REASON → ACTION</text>
      <path d="M42 98V610" stroke="#314454" stroke-width="2"/>

      <g transform="translate(0 52)">
        <circle cx="42" cy="46" r="42" fill="#16222C" stroke="#C8FF43"/>
        <path d="M24 54c10-20 17 4 27-16s15 4 24-12" stroke="#C8FF43" stroke-width="3" stroke-linecap="round"/>
        <text x="112" y="34" fill="#C8FF43" font-size="16" font-weight="700">01 · 量化证据</text>
        <text x="112" y="70" fill="white" font-size="28" font-weight="700">身体动作 → 可测量指标</text>
        <g transform="translate(112 92)">
          <rect width="230" height="58" rx="14" fill="#171E2B" stroke="#2E3C4C"/><text x="18" y="25" fill="#8794A5" font-size="13">手腕速度</text><text x="18" y="47" fill="white" font-size="19" font-weight="700">速度峰值</text>
          <rect x="244" width="230" height="58" rx="14" fill="#171E2B" stroke="#2E3C4C"/><text x="262" y="25" fill="#8794A5" font-size="13">关节角度</text><text x="262" y="47" fill="white" font-size="19" font-weight="700">肘膝区间</text>
          <rect x="488" width="230" height="58" rx="14" fill="#171E2B" stroke="#2E3C4C"/><text x="506" y="25" fill="#8794A5" font-size="13">身体关系</text><text x="506" y="47" fill="white" font-size="19" font-weight="700">肩髋分离</text>
        </g>
      </g>

      <g transform="translate(0 260)">
        <circle cx="42" cy="46" r="42" fill="#16222C" stroke="#C8FF43"/>
        <path d="M23 53h11l8-20 10 31 8-20h14" stroke="#C8FF43" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="112" y="34" fill="#C8FF43" font-size="16" font-weight="700">02 · 评分解释</text>
        <text x="112" y="70" fill="white" font-size="28" font-weight="700">指标组合 → 评分贡献</text>
        <rect x="112" y="94" width="718" height="82" rx="16" fill="#111B25" stroke="#2F414D"/>
        <text x="136" y="124" fill="#8794A5" font-size="14">动作评分</text><text x="136" y="159" fill="#C8FF43" font-size="32" font-weight="700">96</text>
        <rect x="220" y="117" width="570" height="12" rx="6" fill="#26343E"/><rect x="220" y="117" width="514" height="12" rx="6" fill="#C8FF43"/>
        <text x="220" y="155" fill="#B7C0CC" font-size="15">加速清晰 + 重心稳定 + 击球臂展开合理</text>
      </g>

      <g transform="translate(0 488)">
        <circle cx="42" cy="46" r="42" fill="#C8FF43"/>
        <path d="m23 48 12 12 25-30" stroke="#0A1510" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="112" y="34" fill="#C8FF43" font-size="16" font-weight="700">03 · 可执行建议</text>
        <text x="112" y="70" fill="white" font-size="28" font-weight="700">评分原因 → 下一次怎么练</text>
        <rect x="112" y="94" width="718" height="112" rx="16" fill="#C8FF43"/>
        <text x="140" y="131" fill="#33431B" font-size="15" font-weight="700">本次改进重点</text>
        <text x="140" y="170" fill="#0A1510" font-size="23" font-weight="700">引拍时增加肩部转动，减少单纯用手臂挥拍</text>
      </g>
    </g>

    <text x="980" y="1008" fill="#8491A2" font-size="17">关键帧负责“看见”，量化指标负责“解释”，训练建议负责“行动”。</text>
  </g>
</svg>
