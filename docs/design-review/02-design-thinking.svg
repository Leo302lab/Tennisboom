  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="76" y="74" fill="#C8FF43" font-size="18" font-weight="600" letter-spacing="4">DESIGN REVIEW</text>
    <text x="76" y="145" fill="white" font-size="54" font-weight="700">轻量化，不是少做</text>
    <text x="76" y="198" fill="#AEB8C7" font-size="27">而是把算力与反馈集中在关键动作上</text>

    <g transform="translate(76 252)">
      <rect width="236" height="72" rx="16" fill="#171D2B" stroke="#2D3949"/><text x="24" y="29" fill="#7F8C9E" font-size="14">痛点 01</text><text x="24" y="54" fill="white" font-size="19" font-weight="600">持续上传成本高</text>
      <rect x="252" width="236" height="72" rx="16" fill="#171D2B" stroke="#2D3949"/><text x="276" y="29" fill="#7F8C9E" font-size="14">痛点 02</text><text x="276" y="54" fill="white" font-size="19" font-weight="600">视频隐私压力大</text>
      <rect x="504" width="236" height="72" rx="16" fill="#171D2B" stroke="#2D3949"/><text x="528" y="29" fill="#7F8C9E" font-size="14">痛点 03</text><text x="528" y="54" fill="white" font-size="19" font-weight="600">完整视频噪声多</text>
    </g>

    <rect x="64" y="350" width="800" height="624" rx="28" fill="#07110C" stroke="#30453A"/>
    <g clip-path="url(#cards)"><image href="source-thinking.png" x="37" y="142" width="1726" height="971"/></g>
    <rect x="98" y="888" width="730" height="52" rx="12" fill="#0D1A13" stroke="#2D4436"/>
    <circle cx="126" cy="914" r="7" fill="#C8FF43"/><text x="148" y="921" fill="white" font-size="18" font-weight="600">输出关键动作，而不是保存冗长过程</text>

    <g transform="translate(940 250)">
      <text fill="#7F8C9E" font-size="16" font-weight="600" letter-spacing="2">SOLUTION PIPELINE</text>
      <g transform="translate(0 38)">
        <rect width="190" height="116" rx="18" fill="#171D2B" stroke="#344252"/>
        <rect x="22" y="22" width="38" height="30" rx="6" stroke="#C8FF43" stroke-width="2"/><circle cx="41" cy="37" r="8" stroke="#C8FF43" stroke-width="2"/>
        <text x="22" y="80" fill="white" font-size="20" font-weight="600">视频解码</text><text x="22" y="103" fill="#7F8C9E" font-size="14">浏览器本地读取</text>
        <path d="M204 58h42m-10-9 10 9-10 9" stroke="#526171" stroke-width="2"/>
        <rect x="258" width="190" height="116" rx="18" fill="#171D2B" stroke="#344252"/>
        <circle cx="296" cy="35" r="12" stroke="#C8FF43" stroke-width="2"/><path d="M296 47v24m-20 22 20-22 20 22m-39-25 19 3 20-3" stroke="#C8FF43" stroke-width="2"/>
        <text x="280" y="80" fill="white" font-size="20" font-weight="600">姿态推理</text><text x="280" y="103" fill="#7F8C9E" font-size="14">多人关键点时序</text>
        <path d="M462 58h42m-10-9 10 9-10 9" stroke="#526171" stroke-width="2"/>
        <rect x="516" width="190" height="116" rx="18" fill="#171D2B" stroke="#344252"/>
