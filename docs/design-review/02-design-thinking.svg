        <path d="M720 58h42m-10-9 10 9-10 9" stroke="#526171" stroke-width="2"/>
        <rect x="774" width="190" height="116" rx="18" fill="#C8FF43"/>
        <path d="M800 27h40v45h-40zM807 39h26m-26 10h26m-26 10h18" stroke="#0A1510" stroke-width="2"/>
        <text x="796" y="80" fill="#0A1510" font-size="20" font-weight="700">训练报告</text><text x="796" y="103" fill="#344020" font-size="14">关键帧与建议</text>
      </g>
    </g>

    <g transform="translate(940 456)">
      <text fill="white" font-size="28" font-weight="700">能力边界</text>
      <rect y="38" width="474" height="246" rx="22" fill="#111B25" stroke="#2C3D49"/>
      <circle cx="32" cy="72" r="9" fill="#C8FF43"/><text x="54" y="79" fill="#C8FF43" font-size="18" font-weight="700">当前可做到</text>
      <g fill="white" font-size="18"><text x="32" y="122">✓ 多人检测与目标球员锁定</text><text x="32" y="162">✓ 准备 / 引拍 / 击球 / 随挥</text><text x="32" y="202">✓ 评分依据与针对性建议</text><text x="32" y="242">✓ 关键帧及 HTML 报告导出</text></g>

      <rect x="494" y="38" width="470" height="246" rx="22" fill="#111722" stroke="#303745"/>
      <circle cx="526" cy="72" r="9" fill="#778493"/><text x="548" y="79" fill="#AEB7C5" font-size="18" font-weight="700">暂不承诺</text>
      <g fill="#A7B0BE" font-size="18"><text x="526" y="122">— 精确判断真实击球点</text><text x="526" y="162">— 网球与球拍轨迹追踪</text><text x="526" y="202">— 专业教练级医学结论</text><text x="526" y="242">— 任意机位下的稳定评分</text></g>
    </g>

    <g transform="translate(940 806)">
      <rect width="964" height="168" rx="24" fill="#C8FF43"/>
      <text x="32" y="47" fill="#304017" font-size="16" font-weight="700" letter-spacing="2">DESIGN DECISION</text>
      <text x="32" y="91" fill="#0A1510" font-size="28" font-weight="700">先用可解释规则验证价值，再用数据迭代模型。</text>
      <text x="32" y="130" fill="#3D4C26" font-size="18">把模型能力边界直接转化为产品范围，降低成本，也避免“AI 万能”的错误预期。</text>
    </g>
